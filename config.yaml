version: 1.2.2
server:
  host: 127.0.0.1
  port: 8288
  auto_open_browser: true
  auto_load_default_engine: false
  workers: 1
  ssl:
    enabled: false
    certfile: bin/cert.pem
    keyfile: bin/key.pem
models:
  model_source_mode: portable
  default_engine: z_image_turbo_native
  shared:
    comfy_models_dir: ''
    mount_map:
      text: text_encoders
      unet: unet
      vae: vae
      lora: loras
      controlnet: controlnet
      checkpoint: checkpoints
    symlink_strategy: junction
  portable:
    internal_models_dir: pretrained_models
    sub_dirs:
      text: text_encoders
      unet: unet
      vae: vae
      lora: loras
      controlnet: controlnet
      checkpoint: checkpoints
  shared_cache_dir: ''
  engines:
    z_image_turbo_native:
      name: z_image_turbo_native
      display_name: Z-Image Turbo (原生)
      display_name_en: Z-Image Turbo (Native)
      backend: native
      workflow_file: ''
      parameter_schema: ''
      comfy_source_dir: comfy_kernel
      custom_nodes_dir: ''
      seedvr2_source_dir: ''
      text_encoder:
        sub_dir: text
        sub_path: Z_image(turbo)/qwen_3_4b_fp8_mixed.safetensors
      unet:
        sub_dir: unet
        sub_path: Z-image_turbo-bf16/zimageTurboNSFWByStable_2602NSFWFP8.safetensors
      vae:
        sub_dir: vae
        sub_path: FLUX.1-dev(Z-image(turbo))/ae.safetensors
      model_id: ''
      local_model_dir: ''
      vram_gb: 10.0
      ram_gb: 16.0
      default_precision: fp8
      fallback_precision: fp8
      supported_features:
      - txt2img
      - lora_stack_6
      - seedvr2_upscale_2x
      - eses_compare
      - reserved_vram
      default_width: 1024
      default_height: 1024
      latent_channels: null
      latent_downscale: null
      image_formats:
      - png
      license: Apache-2.0
      tags:
      - turbo
      - native
      - low-vram
      weight_sha256: ''
      weight_version: ''
      training_data_source: ''
      compatibility_matrix: {}
inference:
  default_steps: 10
  default_cfg: 1.0
  default_sampler: dpmpp_3m_sde_gpu
  default_scheduler: sgm_uniform
  default_seed: -1
  default_batch_size: 1
  default_format: png
  default_quality: 95
  enable_fp8_fallback: true
  vram_headroom_gb: 2.0
  vram_multisample_rule: 1.5
  vram_tight_continue: true
  torch_compile:
    enabled: false
    backend: inductor
    dynamic: true
    mode: default
  lora_max_units: 6
output:
  base_dir: outputs
  naming_template: '{engine}_{date}_{taskid}_{seed}_{idx}'
  organize_by: engine_date
  image_format: png
  image_quality: 95
  save_thumbnail: true
  thumbnail_format: png
  thumbnail_quality: 90
  thumbnail_max_side: 512
  history:
    db_path: data/history.db
    max_records: 50000
    keep_days: 0
    # 输出目录体积上限（GB）：keep_days=0 时仅按体积清理，激活每日 cron 护栏
    # （成本资源治理评估报告 P1-③：0/0 组合会使 cron 整体禁用，outputs 无界增长）
    max_gb: 10.0
    cleanup_cron: 0 3 * * *
  uploads:
    cache_dir: data/uploads
    max_size_mb: 2000
    max_pixels: 200000000
    ttl_s: 86400
presets:
  dir: data/presets
  allow_engine_mix_presets: true
watermark:
  enabled_in_code: true
  method: dct_frequency
  product_id: IMGMULTI-1
  embed_timestamp: true
  embed_task_id: true
  strength: 0.008
runtime:
  task_queue:
    maxsize: 100
    worker_mode: single_serial
    cancel_timeout_s: 5
    auto_recover: false
    max_timeout_s: 86400
    id_format: ulid
    checkpoint_every: 100
    checkpoint_dir: data/checkpoints
  batch:
    max_retries: 2
    retry_base_delay_s: 1.0
    retry_max_delay_s: 30.0
    stop_on_error: false
  sse:
    poll_interval_s: 0.5
    heartbeat_interval_s: 30
    max_duration_s: 3600
    preview_b64_max_width: 256
  vram_scheduler:
    enabled: false
    vram_high_watermark_pct: 90
    vram_low_watermark_pct: 70
    sample_interval_s: 0.5
    max_batch_size: 4
    min_batch_size: 1
  # 空闲自动卸载阈值（分钟），0=禁用（引擎常驻显存）。显式决策见 docs/adr/ADR-0001-idle-unload-policy.md
  idle_unload_minutes: 0
security:
  allowed_base_dirs:
  - outputs/
  - data/
  - workflows/
  - pretrained_models/
  image_read_base_dirs:
  - outputs/
  - data/
  rate_limit:
    # 单 worker 串行 P95 吞吐 ≈ 1.4 任务/分钟（实测 P95 42.9s），6/min = P95×1.5 缓冲；
    # 原 30/min 超实际吞吐 21 倍，永不触发（成本资源治理评估报告 P2-④）
    infer_per_minute: 6
    upload_per_minute: 10
    global_per_minute: 600
  basic_auth:
    enabled: false
    username: admin
    password_bcrypt_hash: ''
  api_token:
    enabled: false
    tokens:
    - REPLACE_WITH_YOUR_BEARER_TOKEN_32BYTES
  csrf:
    enabled: true
  cors:
    allowed_origins:
    - http://127.0.0.1:8288
    - http://localhost:8288
    - ws://127.0.0.1:*
    allow_credentials: true
  model_format:
    only_safetensors: true
    warn_if_pickle_found: true
    verify_weights: true
    weight_manifest_file: ''
    fail_closed_on_corrupt_weight: true
    allow_unregistered_weights: true
  integrity_selfcheck:
    enabled: true
    manifest_file: app/integrated_app/security/integrity_manifest.json
  content_filter:
    fail_closed_on_clip_missing: false
  headers:
    enabled: true
    csp: ''
gpu:
  backend: auto
  device_ids:
  - 0
  allow_fallback_to_cpu: true
  low_vram_mode: auto
  monitor:
    sample_interval_s: 2
    history_points: 60
ui:
  theme_default: light
  accent_color: '#5e7d5a'
  font_pair: instrument_serif_dm_sans
  sidebar_collapsed_by_default: false
  accordion_default_groups:
  - basic
  - prompt
  history_page_size: 50
  preview_max_size_mb: 20
  a11y:
    focus_ring: true
    reduce_motion: false
i18n:
  default_locale: zh
  available_locales:
  - zh
  - en
  - ja
  - ko
  - zh-tw
  locale_dir: app/integrated_app/locales
  fallback_to_en: true
logging:
  level: INFO
  file: logs/app.log
  max_size_mb: 50
  backup_count: 5
  include_traceback: true
  mask_sensitive_headers: true
cache:
  dir: data/cache
  max_size_mb: 500
  ttl_s: 86400
acceleration:
  vllm:
    enabled: false
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
  tensorrt:
    enabled: false
    engine_cache_dir: data/trt_engines
environment:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  MODELSCOPE_OFFLINE: '1'
  COMFYUI_DISABLE_UPDATE_CHECK: '1'
finops:
  budget_gpu_hours_per_day: 0.0
  storage_gb_budget: 0.0
  alert_level: warning
