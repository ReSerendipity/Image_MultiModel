# ================================================================
#  Schema YAML — FLUX.2 Klein-9B Distilled
#  对应 workflows/Flux.2_Klein-9B-Distilled.json
#  节点 ID 严格对齐 widgets_values 下标（PRD 2.4.4）
# ================================================================
engine_name: "flux2_klein_9b_distilled"
subgraph_id: "95960805-4e0e-42ca-98ba-6cc695c33b66"

# ── 节点定义 ──────────────────────────────────────────────────
nodes:
  # 子图入口节点（Text to Image）
  - id: 64
    type: "subgraph"
    description: "Text to Image (FLUX.2 Klein-9B-Distilled) 子图入口"
    widgets:
      positive_prompt: 0    # 正面提示词
      negative_prompt: 1    # 负面提示词
      cfg: 2                # CFG 值
      steps: 3              # 步数
      width: 4              # 宽度
      height: 5             # 高度

  # UNETLoader (id=69)
  - id: 69
    type: "UNETLoader"
    description: "加载 UNet 模型"
    widgets:
      unet_name: 0          # UNet 文件名
      weight_dtype: 1       # 数据类型

  # CLIPLoader (id=2)
  - id: 2
    type: "CLIPLoader"
    description: "加载 CLIP 文本编码器"
    widgets:
      clip_name: 0          # CLIP 文件名
      clip_type: 1          # 类型 (flux2)
      device: 2             # 设备

  # VAELoader (id=3)
  - id: 3
    type: "VAELoader"
    description: "加载 VAE"
    widgets:
      vae_name: 0           # VAE 文件名

  # EmptyFlux2LatentImage (id=10)
  - id: 10
    type: "EmptyFlux2LatentImage"
    description: "空 Flux2 Latent 图像"
    widgets:
      width: 0              # 宽度
      height: 1             # 高度
      batch_size: 2         # 批量大小

  # CLIPTextEncode Positive (id=4)
  - id: 4
    type: "CLIPTextEncode"
    title: "CLIP Text Encode (Positive Prompt)"
    description: "正面提示词编码"
    widgets: {}

  # CLIPTextEncode Negative (id=15)
  - id: 15
    type: "CLIPTextEncode"
    title: "CLIP Text Encode (Negative Prompt)"
    description: "负面提示词编码"
    widgets: {}

  # RandomNoise (id=6)
  - id: 6
    type: "RandomNoise"
    description: "随机噪波（主 seed）"
    widgets:
      noise_seed: 0         # 噪波种子
      control_after_generate: 1  # "randomize"/"fixed"

  # KSamplerSelect (id=8)
  - id: 8
    type: "KSamplerSelect"
    description: "采样器选择"
    widgets:
      sampler_name: 0       # 采样器名称

  # CFGGuider (id=7)
  - id: 7
    type: "CFGGuider"
    description: "CFG 引导器"
    widgets:
      cfg: 0                # CFG 值

  # Flux2Scheduler (id=9)
  - id: 9
    type: "Flux2Scheduler"
    description: "Flux2 调度器"
    widgets:
      steps: 0              # 步数
      width: 1             # 宽度（同步）
      height: 2            # 高度（同步）

  # SamplerCustomAdvanced (id=11)
  - id: 11
    type: "SamplerCustomAdvanced"
    description: "自定义高级采样器"
    widgets: {}

  # VAEDecode (id=12)
  - id: 12
    type: "VAEDecode"
    description: "VAE 解码"
    widgets: {}

  # LoraLoaderModelOnly (id=16~21, 6 层)
  - id: 16
    type: "LoraLoaderModelOnly"
    layer: 1
    description: "LoRA 层 1"
    widgets:
      lora_name: 0         # LoRA 文件名
      strength_model: 1    # 模型强度

  - id: 17
    type: "LoraLoaderModelOnly"
    layer: 2
    description: "LoRA 层 2"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 18
    type: "LoraLoaderModelOnly"
    layer: 3
    description: "LoRA 层 3"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 19
    type: "LoraLoaderModelOnly"
    layer: 4
    description: "LoRA 层 4"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 20
    type: "LoraLoaderModelOnly"
    layer: 5
    description: "LoRA 层 5"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 21
    type: "LoraLoaderModelOnly"
    layer: 6
    description: "LoRA 层 6"
    widgets:
      lora_name: 0
      strength_model: 1

  # EsesImageCompare (id=59)
  - id: 59
    type: "EsesImageCompare"
    description: "Eses 双图对比"
    widgets:
      compare_mode: 0       # "normal"
      compare_axis: null    # 属性字段，非 widgets

  # ReservedVRAMSetter (id=60)
  - id: 60
    type: "ReservedVRAMSetter"
    description: "显存预留设置"
    widgets:
      reserved: 0           # 预留 GB
      mode: 1                # 模式 (auto/manual)
      seed: 2                # 独立 seed
      control_after_generate: 3  # "randomize"/"fixed"
      auto_max_reserved: 4   # 自动最大预留
      clean_gpu_before: 5    # 是否清理 GPU

  # SeedVR2LoadVAEModel (id=61)
  - id: 61
    type: "SeedVR2LoadVAEModel"
    description: "SeedVR2 VAE 加载"
    widgets:
      model: 1              # 模型名
      device: 2              # 设备
      encode_tiled: 3
      encode_tile_size: 4
      encode_tile_overlap: 5
      decode_tiled: 6
      decode_tile_size: 7
      decode_tile_overlap: 8
      tile_debug: 9
      offload_device: 10
      cache_model: 11

  # SeedVR2VideoUpscaler (id=62)
  - id: 62
    type: "SeedVR2VideoUpscaler"
    description: "SeedVR2 超分"
    widgets:
      seed: 0               # 独立 seed
      control_after_generate: 1  # "randomize"/"fixed"
      resolution: 2          # 目标分辨率
      max_resolution: 3
      batch_size: 4
      uniform_batch_size: 5
      color_correction: 6   # 颜色校正 (lab/etc)

  # SeedVR2LoadDiTModel (id=63)
  - id: 63
    type: "SeedVR2LoadDiTModel"
    description: "SeedVR2 DiT 加载"
    widgets:
      model: 1
      device: 2
      blocks_to_swap: 3
      swap_io_components: 4
      offload_device: 5
      cache_model: 6
      attention_mode: 7

  # SaveImage (id=53)
  - id: 53
    type: "SaveImage"
    description: "保存图片"
    widgets:
      filename_prefix: 0    # 文件名前缀

  # 预览/缩放节点（始终 bypass）
  - id: 57
    type: "ImageScaleToTotalPixels"
    description: "缩放预览（bypass）"
    bypass: true

  - id: 58
    type: "PreviewImage"
    description: "预览图（bypass）"
    bypass: true

  - id: 56
    type: "Fast Groups Bypasser (rgthree)"
    description: "分组旁路（bypass）"
    bypass: true

# ── link 重连规则（关闭功能时的 link 修改）──────────────────
link_overrides:
  # 关闭 SeedVR2 时：VAEDecode(12) 输出直连到 ReservedVRAMSetter(60) / EsesImageCompare(59)
  seedvr2_off:
    - link_id: 68  # VAEDecode → SeedVR2VideoUpscaler
      # 关闭后这条 link 不生效（node bypass）
    - link_id: 74  # SeedVR2VideoUpscaler → output
      # 改为 VAEDecode 直接到 output
      new_origin_id: 12
      new_origin_slot: 0

  # 关闭 Eses 时：EsesImageCompare(59) bypass，VAEDecode → SaveImage 直通
  eses_off:
    - link_id: 78  # EsesImageCompare → SaveImage
      # 改为 VAEDecode → SaveImage
      new_origin_id: 12
      new_origin_slot: 0
