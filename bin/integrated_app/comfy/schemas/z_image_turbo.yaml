# ================================================================
#  Schema YAML — Z-Image Turbo
#  对应 workflows/Z_image_turbo.json
#  节点 ID 严格对齐 widgets_values 下标（PRD 2.4.4）
# ================================================================
engine_name: "z_image_turbo"
subgraph_id: "82388757-f3fe-445d-98b4-26314784fcba"

# ── 节点定义 ──────────────────────────────────────────────────
nodes:
  # 子图入口节点（Text to Image）
  - id: 82
    type: "subgraph"
    description: "Text to Image (Z-Image-Turbo) 子图入口"
    widgets:
      positive_prompt: 0
      negative_prompt: 1
      cfg: 2
      steps: 3
      width: 4
      height: 5

  # UNETLoader (id=1)
  - id: 1
    type: "UNETLoader"
    description: "加载 UNet 模型"
    widgets:
      unet_name: 0
      weight_dtype: 1

  # CLIPLoader (id=2)
  - id: 2
    type: "CLIPLoader"
    description: "加载 CLIP 文本编码器"
    widgets:
      clip_name: 0
      clip_type: 1
      device: 2

  # VAELoader (id=3)
  - id: 3
    type: "VAELoader"
    description: "加载 VAE"
    widgets:
      vae_name: 0

  # EmptySD3LatentImage (id=4)
  - id: 4
    type: "EmptySD3LatentImage"
    description: "空 SD3 Latent 图像"
    widgets:
      width: 0
      height: 1
      batch_size: 2

  # CLIPTextEncode Positive (id=6)
  - id: 6
    type: "CLIPTextEncode"
    title: "CLIP Text Encode (Positive Prompt)"
    description: "正面提示词编码"
    widgets: {}

  # CLIPTextEncode Negative (id=5)
  - id: 5
    type: "CLIPTextEncode"
    title: "CLIP Text Encode (Negative Prompt)"
    description: "负面提示词编码"
    widgets: {}

  # KSampler (id=7)
  - id: 7
    type: "KSampler"
    description: "K 采样器（含主 seed）"
    widgets:
      seed: 0               # 主 seed
      control_after_generate: 1  # "randomize"/"fixed"
      steps: 2              # 步数
      cfg: 3                # CFG 值
      sampler_name: 4       # 采样器名称
      scheduler: 5          # 调度器
      denoise: 6            # 降噪强度

  # ModelSamplingAuraFlow (id=8)
  - id: 8
    type: "ModelSamplingAuraFlow"
    description: "AuraFlow 模型采样"
    widgets:
      shift: 0              # 移位值

  # VAEDecode (id=9)
  - id: 9
    type: "VAEDecode"
    description: "VAE 解码"
    widgets: {}

  # LoraLoaderModelOnly (id=16~21, 6 层)
  - id: 16
    type: "LoraLoaderModelOnly"
    layer: 1
    description: "LoRA 层 1"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 17
    type: "LoraLoaderModelOnly"
    layer: 2
    description: "LoRA 层 2"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 18
    type: "LoraLoaderModelOnly"
    layer: 3
    description: "LoRA 层 3"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 19
    type: "LoraLoaderModelOnly"
    layer: 4
    description: "LoRA 层 4"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 20
    type: "LoraLoaderModelOnly"
    layer: 5
    description: "LoRA 层 5"
    widgets:
      lora_name: 0
      strength_model: 1

  - id: 21
    type: "LoraLoaderModelOnly"
    layer: 6
    description: "LoRA 层 6"
    widgets:
      lora_name: 0
      strength_model: 1

  # EsesImageCompare (id=77)
  - id: 77
    type: "EsesImageCompare"
    description: "Eses 双图对比"
    widgets:
      compare_mode: 0
      compare_axis: null

  # ReservedVRAMSetter (id=78)
  - id: 78
    type: "ReservedVRAMSetter"
    description: "显存预留设置"
    widgets:
      reserved: 0
      mode: 1
      seed: 2
      control_after_generate: 3
      auto_max_reserved: 4
      clean_gpu_before: 5

  # SeedVR2LoadVAEModel (id=79)
  - id: 79
    type: "SeedVR2LoadVAEModel"
    description: "SeedVR2 VAE 加载"
    widgets:
      model: 1
      device: 2
      encode_tiled: 3
      encode_tile_size: 4
      encode_tile_overlap: 5
      decode_tiled: 6
      decode_tile_size: 7
      decode_tile_overlap: 8
      tile_debug: 9
      offload_device: 10
      cache_model: 11

  # SeedVR2VideoUpscaler (id=80)
  - id: 80
    type: "SeedVR2VideoUpscaler"
    description: "SeedVR2 超分"
    widgets:
      seed: 0
      control_after_generate: 1
      resolution: 2
      max_resolution: 3
      batch_size: 4
      uniform_batch_size: 5
      color_correction: 6

  # SeedVR2LoadDiTModel (id=81)
  - id: 81
    type: "SeedVR2LoadDiTModel"
    description: "SeedVR2 DiT 加载"
    widgets:
      model: 1
      device: 2
      blocks_to_swap: 3
      swap_io_components: 4
      offload_device: 5
      cache_model: 6
      attention_mode: 7

  # SaveImage (id=71)
  - id: 71
    type: "SaveImage"
    description: "保存图片"
    widgets:
      filename_prefix: 0

  # 预览/缩放节点（始终 bypass）
  - id: 75
    type: "ImageScaleToTotalPixels"
    description: "缩放预览（bypass）"
    bypass: true

  - id: 76
    type: "PreviewImage"
    description: "预览图（bypass）"
    bypass: true

  - id: 74
    type: "Fast Groups Bypasser (rgthree)"
    description: "分组旁路（bypass）"
    bypass: true

# ── link 重连规则 ─────────────────────────────────────────────
link_overrides:
  seedvr2_off:
    - link_id: 100  # VAEDecode → SeedVR2VideoUpscaler
    - link_id: 104  # SeedVR2VideoUpscaler → output
      new_origin_id: 9
      new_origin_slot: 0

  eses_off:
    - link_id: 108  # EsesImageCompare → SaveImage
      new_origin_id: 9
      new_origin_slot: 0
