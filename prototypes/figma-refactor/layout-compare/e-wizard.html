<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布局对比 · E 分步向导</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f5;--surface:#fff;--surface-2:#f0f0f0;--surface-3:#e6e6e6;--ink:#1a1a1a;--ink-soft:#5f5f5f;--ink-faint:#8f8f8f;--accent:#a78bfa;--accent-strong:#8b7bd8;--accent-soft:#efebfc;--wire:#d9d9d9;--wire-strong:#b3b3b3;--dot:#e5e5e5;--sans:'Inter',system-ui,sans-serif;--radius:8px;--topbar-h:52px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}
.cmp-bar{position:fixed;top:0;left:0;right:0;height:34px;background:#232326;color:#d9d9e3;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100;font-size:11.5px}
.cmp-bar b{font-weight:600;color:#fff}
.cmp-bar .links{display:flex;gap:4px}
.cmp-bar a{color:#a9a9b5;text-decoration:none;padding:4px 10px;border-radius:6px}
.cmp-bar a:hover{color:#fff;background:rgba(255,255,255,.08)}
.cmp-bar a.cur{background:#8b7bd8;color:#fff;font-weight:600}
.topbar{position:fixed;top:34px;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--wire);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50}
.logo{display:flex;align-items:center;gap:9px}
.figma-logo{display:flex}
.figma-logo span{width:11px;height:20px}
.fl-1{background:#f24e1e;border-radius:6px 0 0 6px}.fl-2{background:#ff7262;border-radius:0 6px 6px 0}.fl-3{background:#a259ff;border-radius:6px}
.logo-text{font-size:12.5px;font-weight:600}.logo-text i{font-style:normal;color:var(--ink-faint)}
.topbar-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:30px;height:30px;border:1px solid transparent;background:var(--surface);border-radius:6px;color:var(--ink-soft)}
select{font-family:inherit;font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:6px;padding:5px 9px;height:30px;outline:none}
.share-btn{background:var(--accent-strong);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;height:30px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#a259ff,#0acf83)}
.layout{min-height:100vh;padding-top:calc(34px + var(--topbar-h));padding-bottom:30px;max-width:880px;margin:0 auto;padding-left:20px;padding-right:20px}
/* 步骤条 */
.stepper{display:flex;align-items:center;gap:8px;margin:22px 0 16px}
.step{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
.step .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--wire-strong);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.step.done .n{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur{color:var(--ink);font-weight:600}
.step.cur .n{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.step-line{flex:1;height:1px;background:var(--wire)}
.step-line.done{background:var(--accent)}
/* 面板 */
.stage-panel{border:1px solid var(--wire);border-radius:12px;background:var(--surface);padding:18px;min-height:420px}
.pane-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;margin-bottom:14px}
.pane-title .no{color:var(--accent);font-weight:700}
.pane-title .desc{font-size:10.5px;color:var(--ink-faint);font-weight:400;margin-left:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup label{font-size:11px;color:var(--ink-soft)}
.fgroup input,.fgroup select{font-family:inherit;font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:6px;padding:7px 9px;outline:none}
.fgroup input:focus,.fgroup select:focus{border-color:var(--accent);background:var(--surface)}
textarea{width:100%;height:110px;font-family:inherit;font-size:12.5px;padding:9px 11px;border:1px dashed var(--wire-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical}
.meta{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--ink-faint)}
.summary{border:1px dashed var(--wire-strong);border-radius:8px;padding:12px;font-size:12px;line-height:1.9}
.summary b{font-weight:600}
.summary .kv{display:flex;justify-content:space-between;border-bottom:1px dashed var(--wire);padding:5px 0}
.summary .kv:last-child{border-bottom:none}
.summary .kv span{color:var(--ink-soft)}
.preview-box{margin-top:14px;border:1px dashed var(--wire-strong);border-radius:8px;height:150px;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 10px,var(--surface-2) 10px,var(--surface-2) 20px);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;letter-spacing:.1em}
/* 导航 */
.nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:var(--surface-2);color:var(--ink);border-radius:6px;padding:9px 18px;font-size:12.5px;font-weight:600}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--accent-strong);color:#fff}
.btn-primary:hover{background:var(--accent-soft);color:var(--accent-strong)}
.btn-ghost{border:1px solid var(--wire);background:var(--surface)}
.nav-hint{font-size:10.5px;color:var(--ink-faint)}
.statusbar{position:fixed;bottom:0;left:0;right:0;height:30px;background:var(--surface);border-top:1px solid var(--wire);display:flex;align-items:center;gap:16px;padding:0 12px;font-size:10px;color:var(--ink-soft);z-index:50}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.green{background:#22c55e}
.sb-right{margin-left:auto;display:flex;gap:12px}
.zoom{padding:2px 8px;border:1px solid var(--wire);border-radius:5px}
</style>
</head>
<body>

<div class="cmp-bar"><b>族 3 · E 分步向导（步骤时间线，一次一步）</b><div class="links"><a href="a-creative.html">A</a><a href="b-split.html">B</a><a href="c-collapsible.html">C</a><a href="d-drawer.html">D</a><a href="e-wizard.html" class="cur">E</a><a href="f-pipeline.html">F</a><a href="g-master-detail.html">G</a><a href="h-minimal.html">H</a></div></div>

<header class="topbar">
  <div class="logo"><span class="figma-logo"><span class="fl-1"></span><span class="fl-2"></span><span class="fl-3"></span></span><span class="logo-text">Image MultiModel <i>/ txt2img 工作台</i></span></div>
  <div class="topbar-right">
    <button class="icon-btn" type="button">◐</button>
    <select style="width:160px"><option>Z-Image Turbo</option></select>
    <button class="share-btn" type="button">分享</button>
    <span class="avatar"></span>
  </div>
</header>

<div class="layout">
  <div class="stepper" id="stepper">
    <div class="step cur" data-s="0"><span class="n">1</span>Prompt</div><div class="step-line" id="sl0"></div>
    <div class="step" data-s="1"><span class="n">2</span>基础参数</div><div class="step-line" id="sl1"></div>
    <div class="step" data-s="2"><span class="n">3</span>增强</div><div class="step-line" id="sl2"></div>
    <div class="step" data-s="3"><span class="n">4</span>确认生成</div>
  </div>

  <section class="stage-panel" id="panel">
    <div class="pane-title"><span class="no" id="stepNo">/</span><span id="stepTitle">Prompt 输入</span><span class="desc" id="stepDesc">步骤 1 / 4</span></div>
    <div id="stepBody">
      <div class="fgroup" style="margin-bottom:12px"><label>正向 Prompt（支持 简中/繁中/英/日/韩）</label><textarea placeholder="一位亚洲女性肖像，柔和自然光，浅景深，胶片质感，细节丰富"></textarea><div class="meta"><span>行 2 · 28 字符 · ≈42 token</span><span>清空 / 复制</span></div></div>
      <div class="fgroup"><label>负向 Prompt（可为空）</label><textarea style="height:64px" placeholder="低质量、模糊、变形…"></textarea></div>
    </div>
  </section>

  <div class="nav-row">
    <button class="btn btn-ghost" id="prevBtn" type="button" disabled>← 上一步</button>
    <span class="nav-hint" id="navHint">按步骤引导配置，避免遗漏</span>
    <button class="btn btn-primary" id="nextBtn" type="button">下一步 →</button>
  </div>
</div>

<footer class="statusbar">
  <span class="dot green"></span>CONN: LOCAL:8188 · 12MS
  <span>QUEUE 1·0</span>
  <div class="sb-right"><span>GPU 16.2/24GB</span><span>ENGINE: Z-IMAGE TURBO</span><span class="zoom">− 100% ＋</span></div>
</footer>

<script>
var steps=[
 {t:'Prompt 输入',d:'步骤 1 / 4',h:'按步骤引导配置，避免遗漏',
  b:'<div class="fgroup" style="margin-bottom:12px"><label>正向 Prompt（支持 简中/繁中/英/日/韩）</label><textarea placeholder="一位亚洲女性肖像，柔和自然光，浅景深，胶片质感，细节丰富"></textarea><div class="meta"><span>行 2 · 28 字符 · ≈42 token</span><span>清空 / 复制</span></div></div><div class="fgroup"><label>负向 Prompt（可为空）</label><textarea style="height:64px" placeholder="低质量、模糊、变形…"></textarea></div>'},
 {t:'基础参数',d:'步骤 2 / 4',h:'估算：预计生成 3 张 · ≥500 黄 / ≥5000 红',
  b:'<div class="fgrid"><div class="fgroup"><label>cfg（蒸馏推荐 1.0）</label><input value="1.0"></div><div class="fgroup"><label>steps</label><input value="8"></div><div class="fgroup"><label>width（16 倍数）</label><input value="1024"></div><div class="fgroup"><label>height（16 倍数）</label><input value="1024"></div><div class="fgroup"><label>seed（-1=随机）</label><input value="-1"></div><div class="fgroup"><label>batch_size [1,9999]</label><input value="1"></div></div>'},
 {t:'增强（超分 / 对比 / 显存）',d:'步骤 3 / 4',h:'LoRA 6 层 · SeedVR2 · Eses · ReservedVRAM',
  b:'<div class="fgrid"><div class="fgroup"><label>LoRA 叠加（6 层串联）</label><input value=" 1.0 · 0.7 · 0.5 · …"></div><div class="fgroup"><label>SeedVR2 超分</label><input value="on · 2048 · lab"></div><div class="fgroup"><label>Eses 双图对比</label><input value="on · horizontal"></div><div class="fgroup"><label>ReservedVRAM</label><input value="on · 0.6GB · auto"></div></div>'},
 {t:'确认生成',d:'步骤 4 / 4',h:'核对摘要后点击生成',
  b:'<div class="summary"><div class="kv"><span>引擎 / 预设</span><b>Z-Image Turbo · 默认预设</b></div><div class="kv"><span>Prompt</span><b>一位亚洲女性肖像…（28 字符）</b></div><div class="kv"><span>分辨率</span><b>1024 × 1024 · 8 steps · cfg 1.0</b></div><div class="kv"><span>增强</span><b>SeedVR2 2048 + Eses h + VRAM 0.6</b></div><div class="kv"><span>预计输出</span><b>3 张（original / upscaled / compare）</b></div></div><div class="preview-box">PREVIEW · 生成前预览</div>'}
];
var cur=0;
var stepNo=document.getElementById('stepNo'),stepTitle=document.getElementById('stepTitle'),stepDesc=document.getElementById('stepDesc'),stepBody=document.getElementById('stepBody'),navHint=document.getElementById('navHint');
function render(){
  stepNo.textContent='/'+String(cur+1).padStart(2,'0');
  stepTitle.textContent=steps[cur].t;stepDesc.textContent=steps[cur].d;navHint.textContent=steps[cur].h;
  stepBody.innerHTML=steps[cur].b;
  document.getElementById('prevBtn').disabled=cur===0;
  document.getElementById('nextBtn').textContent=cur===steps.length-1?'▶ 生成':'下一步 →';
  document.querySelectorAll('#stepper .step').forEach(function(s,idx){
    s.classList.toggle('cur',idx===cur);s.classList.toggle('done',idx<cur);
  });
  document.getElementById('sl0').classList.toggle('done',cur>=1);
  document.getElementById('sl1').classList.toggle('done',cur>=2);
  document.getElementById('sl2').classList.toggle('done',cur>=3);
}
document.getElementById('prevBtn').addEventListener('click',function(){if(cur>0){cur--;render();}});
document.getElementById('nextBtn').addEventListener('click',function(){if(cur<steps.length-1){cur++;render();}});
render();
</script>
</body>
</html>
