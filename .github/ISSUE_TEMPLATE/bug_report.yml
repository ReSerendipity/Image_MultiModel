name: Bug 报告
description: 提交一个 Bug 报告帮助我们改进
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽可能详细地填写以下信息，这能帮助我们快速定位问题。
        图像生成项目的 Bug 90% 和环境有关，请务必填写环境信息。

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述你遇到的问题
      placeholder: "例如：生成图片时出现 OOM 错误，但显存应该足够"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 启动 Image MultiModel（python bin/clean_launch.py）
        2. 在 Web UI 中选择引擎 '...'
        3. 输入 Prompt '...'
        4. 设置参数：分辨率 ..., steps ..., batch_size ...
        5. 点击生成
        6. 出现错误
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: "例如：图片应该正常生成并保存到 outputs/ 目录"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: "例如：报错 'CUDA out of memory'，任务状态变为 failed"
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: 错误日志 / 截图
      description: 粘贴错误日志或截图。可以查看 logs/app.log 获取详细日志。
      placeholder: |
        ```
        粘贴错误日志到这里
        ```
      render: shell
    validations:
      required: true

  - type: input
    id: gpu-model
    attributes:
      label: GPU 型号
      description: 你的显卡型号
      placeholder: "例如：NVIDIA RTX 5070 Ti"
    validations:
      required: true

  - type: input
    id: gpu-vram
    attributes:
      label: GPU 显存 (GB)
      description: 你的显卡显存大小
      placeholder: "例如：12"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 运行 `python --version` 的输出
      placeholder: "例如：Python 3.12.10"
    validations:
      required: true

  - type: input
    id: comfyui-version
    attributes:
      label: ComfyUI 版本
      description: ComfyUI 的版本号（在 ComfyUI 终端启动日志中可见）
      placeholder: "例如：0.31.1"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Image MultiModel 版本
      description: 项目版本（见 README.md 徽章或 config.yaml version 字段）
      placeholder: "例如：2.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - Debian 12
        - macOS
        - 其他
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: 使用的引擎
      description: 出现问题时使用的引擎
      options:
        - z_image_turbo_native
        - z_image_turbo
        - 两个都有
        - 不确定
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: config.yaml 关键配置段
      description: 粘贴你的 config.yaml 中与问题相关的配置段（**请移除敏感信息如密码/Token**）
      placeholder: |
        ```yaml
        models:
          model_source_mode: shared
          default_engine: z_image_turbo_native

        comfy:
          backends:
            local:
              base_url: http://127.0.0.1:8188

        inference:
          default_steps: 8
          vram_headroom_gb: 2.0
        ```
      render: yaml
    validations:
      required: false

  - type: textarea
    id: model-source-mode
    attributes:
      label: 模型路径模式
      description: 你使用的是 shared 还是 portable 模式？
      placeholder: "shared / portable"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？
    validations:
      required: false
