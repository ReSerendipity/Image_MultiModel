name: 功能请求
description: 提出一个新功能建议
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请详细描述你的需求，帮助我们理解其价值。

  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 要解决的问题
      description: 你为什么需要这个功能？它解决了什么问题？
      placeholder: "例如：我需要在批量生成时能够设置不同的 LoRA 强度，目前只能全局设置一个值"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望怎么实现？描述你期望的功能行为。
      placeholder: |
        例如：在批量生成的 Grid 维度中新增 lora_1_strength 参数，
        允许为每张图设置不同的 LoRA 强度（0.1~1.0）。
        前端在批量抽屉中显示一个滑块网格。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他实现方式？为什么当前方案更好？
      placeholder: "例如：也可以用预设系统实现，但每次都要创建多个预设，不够灵活"
    validations:
      required: false

  - type: dropdown
    id: workflow-related
    attributes:
      label: 工作流相关说明
      description: 这个功能是否需要新增/修改 ComfyUI 工作流节点？
      options:
        - 不涉及工作流（纯前端/后端 API）
        - 需要修改现有工作流 JSON
        - 需要新增工作流 JSON
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你的重要程度
      options:
        - 高 - 严重影响使用体验
        - 中 - 有更好，没有也能用
        - 低 - 锦上添花
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: UI/UX 建议（可选）
      description: 如果涉及界面改动，描述你期望的交互方式或附上草图
      placeholder: "例如：在高级参数抽屉的 LoRA 区域新增一个'批量模式'开关..."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 还有其他需要说明的吗？
    validations:
      required: false
