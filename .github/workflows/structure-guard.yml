name: structure-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 PR 的连续 push 只保留最新一次运行。
# group 必须带 github.event_name：cancel-in-progress 是在【新来的那次运行】的上下文里
# 求值的，只按 github.ref 分组时，一次 merge 到 main 的 push 会把同期在跑的周度定时
# 扫描直接取消掉（表达式写在旧运行身上也救不了——被判断的是新运行）。把事件放进
# group 后定时运行自成一组，push/PR 碰不到它。
# 本 workflow 无 schedule 触发，加 event_name 只是与另三个口径一致。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      - name: Check spec references (if present)
        run: |
          if [ -f scripts/check_spec_refs.py ]; then
            python scripts/check_spec_refs.py
          else
            echo "scripts/check_spec_refs.py not present; skipping"
          fi
