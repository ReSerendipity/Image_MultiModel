name: structure-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一 PR/分支的连续 push 只保留最新一次运行（组名口径同 ci.yml）。
# 本 workflow 无 schedule 触发，可直接 cancel。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository root layout
        run: python .github/scripts/check_layout.py
      - name: Check spec references (if present)
        run: |
          if [ -f scripts/check_spec_refs.py ]; then
            python scripts/check_spec_refs.py
          else
            echo "scripts/check_spec_refs.py not present; skipping"
          fi
