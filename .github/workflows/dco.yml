name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# 同一 PR 的连续 push 只保留最新一次运行。
# group 必须带 github.event_name：cancel-in-progress 是在【新来的那次运行】的上下文里
# 求值的，只按 github.ref 分组时，一次 merge 到 main 的 push 会把同期在跑的周度定时
# 扫描直接取消掉（表达式写在旧运行身上也救不了——被判断的是新运行）。把事件放进
# group 后定时运行自成一组，push/PR 碰不到它。
# 实测：DCO 近 100 次 PR 运行里 35% 是同一分支的后续 push 覆盖跑（本仓无 schedule 触发，
# 加了 event_name 只是与另三个口径一致）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO Check
    # 不做 job 级 if 跳过：整条 job 被跳过时该 required 检查根本不产出，
    # 「未验证」会被读成「未出现」而非「已豁免」。豁免下沉到逐条 commit，
    # 按 author 邮箱判定（见脚本内 bot 名单）。
    runs-on: ubuntu-24.04  # P0-1 第一步：required context 所在 job 钉死镜像，见 on: 注释
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "::error::Could not determine PR base/head SHA"
            exit 1
          fi
          # DCO 的 Signed-off-by 是对人类贡献者的来源认证，机器人 commit 无法携带
          # 有意义的签名，故按 author 邮箱豁免这两类 bot（含 <userid>+bot@users.noreply
          # 形式）。判定只看每条 commit 的作者，不看 github.actor：否则 dependabot
          # 触发的 PR 里人工补的 commit 也会跟着一起免检。
          bot_email_pats=("dependabot[bot]@users.noreply.github.com" "support@dependabot.com" "github-actions[bot]@users.noreply.github.com" "github-actions@github.com")
          is_bot_author() {
            local e="${1,,}" p
            for p in "${bot_email_pats[@]}"; do
              [[ "$e" == *"$p"* ]] && return 0
            done
            return 1
          }
          fails=0 human=0 bot=0
          while IFS= read -r commit; do
            author_email="$(git log -1 --format='%ae' "$commit")"
            if is_bot_author "$author_email"; then
              echo "SKIP  $commit bot author <$author_email>"
              bot=$((bot + 1))
              continue
            fi
            human=$((human + 1))
            if git log -1 --format='%B' "$commit" | grep -q 'Signed-off-by:'; then
              echo "OK    $commit"
            else
              echo "::error::Commit $commit (author <$author_email>) is missing 'Signed-off-by:' trailer (run: git commit -s)"
              fails=1
            fi
          done < <(git rev-list "$base_sha..$head_sha")
          # 区间为空说明 base/head 取错了（PR 不可能零 commit）——静默 exit 0 会
          # 把「一条都没查」报成绿色，这里按失败处理。
          if (( human + bot == 0 )); then
            echo "::error::No commits in $base_sha..$head_sha - nothing was checked"
            exit 1
          fi
          echo "DCO: $human human commit(s) checked, $bot bot commit(s) exempt, $fails failure(s)"
          exit $fails
