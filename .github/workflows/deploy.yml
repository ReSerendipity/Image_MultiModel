name: Deploy

# P2-11: staging 部署 + post-deploy smoke 门禁；smoke 失败自动阻断晋级。
# P2-12: blue-green 双槽位部署 + 一键 rollback（deploy / rollback 子命令）。
#
# 触发：release.yml 成功之后（workflow_run），或手工 dispatch。
# 环境要求（self-hosted runner 上执行，需要能访问目标 GPU 机器）：
#   - docker + docker compose v2
#   - 目标机可通过 SSH 访问（secrets：STAGING_HOST / STAGING_USER / STAGING_SSH_KEY；
#     生产同理使用 PROD_* secrets）。
#   - 未配置 secrets 时走「演练模式」：在托管 runner 上 build 真实镜像 +
#     IMM_FAKE_ENGINE=1 起服 → 容器内跑同一份 smoke → 拆服。演练只验证门禁管道，
#     不校验产物实体（见 staging job 注释），因此 production job 会硬拒绝演练结果。
#     注意：演练不能用 docker compose —— docker-compose.yml 无条件预留 nvidia 设备，
#     无 GPU 驱动的 runner 上容器根本起不来（CI 34612430147 即败于此）。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]
      image_tag:
        description: "Immutable image tag (e.g., 2.0.1 or git-<sha>)"
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ── staging 部署 + post-deploy smoke ────────────────────────
  staging:
    name: Deploy to staging + smoke gate (P2-11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            # 从 Release workflow 的产物读取（build_metadata.json 附件）
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke deps
        run: pip install pytest pytest-timeout

      # ── 部署模式选择：远端（secrets 配置时）或本地演练 ──────────
      - name: Deploy (remote staging via SSH)
        if: vars.HAS_STAGING_SECRETS == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan "$HOST" >> ~/.ssh/known_hosts
          # blue-green：先部署到 idle 槽位（active 槽位继续服务）
          ACTIVE=$(ssh -i ~/.ssh/id_deploy "$USER@$HOST" 'cat /opt/imm/active_slot 2>/dev/null || echo blue')
          IDLE=$([ "$ACTIVE" = "blue" ] && echo green || echo blue)
          echo "active=$ACTIVE idle=$IDLE"
          echo "TARGET_SLOT=$IDLE" >> $GITHUB_ENV
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "IMAGE_TAG=${{ steps.tag.outputs.tag }} ./imm-deploy-$IDLE.sh up -d"

      - name: Deploy (local drill, no staging secrets)
        if: vars.HAS_STAGING_SECRETS != 'true'
        run: |
          # 演练模式：build 真实镜像 + docker run 注入 IMM_FAKE_ENGINE=1，与 ci.yml 的
          # P0-1 容器门禁同一手法。不走 docker compose：其 nvidia 设备预留在无 GPU 的
          # 托管 runner 上必然报 could not select device driver "nvidia"。
          # 也不发布端口：config.yaml server.host=127.0.0.1，容器内只监听回环，
          # 主机经 -p 打不进去，故探活与 smoke 一律在容器内执行。
          IMAGE="image-multimodel:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMAGE" .
          docker run -d --name imm_drill -e IMM_FAKE_ENGINE=1 "$IMAGE"
          # 等待健康（最长 90s）
          for i in $(seq 1 90); do
            if docker exec imm_drill python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8288/api/health', timeout=3)" 2>/dev/null; then
              echo "[OK] service healthy after ${i} probes"
              exit 0
            fi
            sleep 1
          done
          echo "[FAIL] service not healthy within 90s"
          docker logs imm_drill 2>&1 | tail -200
          exit 1

      - name: Resolve smoke target
        id: target
        run: |
          # 远端模式的 post-deploy smoke 必须打到 staging 主机。原写法是
          # vars.STAGING_BASE_URL || 'http://127.0.0.1:8288'，而远端模式下的
          # 127.0.0.1 指的是 runner 本机——那里什么都没部署，门禁会对着空气跑完
          # 6 项检查并给出无意义的结论。配置不足即硬失败，不做静默回退。
          if [ "${{ vars.HAS_STAGING_SECRETS }}" = "true" ] && [ -z "${{ vars.STAGING_BASE_URL }}" ]; then
            echo "[FAIL] HAS_STAGING_SECRETS=true 但未设置仓库变量 STAGING_BASE_URL。"
            echo "       处置：gh variable set STAGING_BASE_URL --body 'http://<staging-host>:8288'"
            echo "       （或经反向代理的、本 job 可访问的地址）"
            exit 1
          fi
          echo "url=${{ vars.STAGING_BASE_URL }}" >> $GITHUB_OUTPUT

      - name: Run post-deploy smoke (P2-11 gate)
        # ⚠️ 不设 continue-on-error：smoke 失败即 job 失败 → 晋级被阻断
        env:
          # 演练分支不使用该值（直接打容器内回环），仅远端模式消费
          BASE_URL: ${{ steps.target.outputs.url }}
        run: |
          # --require-real-output 属真实部署专属：IMM_FAKE_ENGINE=1 下产物路径前缀为
          # imm_fake，post_deploy_smoke.py 对其直接判失败——该 flag 只用于真实部署晋级
          # 门禁（另一启用点是 scripts/deploy/bluegreen.sh 的 smoke_full()）。
          # 演练模式因此只跑前 6 项 + 不加产物校验，验证的是门禁管道本身而非产物真实性。
          if [ "${{ vars.HAS_STAGING_SECRETS }}" = "true" ]; then
            python scripts/post_deploy_smoke.py \
              --base-url "$BASE_URL" \
              --timeout 15 \
              --generation-timeout 120 \
              --require-real-output \
              --output smoke_report.json
          else
            docker exec imm_drill python scripts/post_deploy_smoke.py \
              --base-url http://127.0.0.1:8288 \
              --timeout 15 \
              --generation-timeout 120 \
              --output /app/smoke_report.json
            docker cp imm_drill:/app/smoke_report.json ./smoke_report.json
            echo "::notice::演练模式：产物实体校验不参与，本次仅验证晋级门禁管道"
          fi
        id: smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-staging-${{ github.run_number }}
          path: smoke_report.json

      - name: Mark staging slot active (only after smoke passes)
        if: vars.HAS_STAGING_SECRETS == 'true' && steps.smoke.outcome == 'success'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "echo $TARGET_SLOT > /opt/imm/active_slot; echo 'previous=$ACTIVE current=$TARGET_SLOT'"

      - name: Stop local drill service
        if: vars.HAS_STAGING_SECRETS != 'true'
        run: docker rm -f imm_drill || true

      - name: Block promotion on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "[FAIL] post-deploy smoke 未通过，晋级已阻断（production job 不会被触发）。"
          echo "       请查看 smoke_report.json 定位失败检查项，修复后重新发布。"
          exit 1

  # ── 生产晋级（仅在 staging smoke 通过 + 人工批准 后执行）──────
  production:
    name: Promote to production
    needs: staging
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    timeout-minutes: 30
    environment: production   # 需要人工批准（GitHub environment protection rule）
    steps:
      - uses: actions/checkout@v4
      - name: Refuse promotion from drill-verified staging
        env:
          HAS_STAGING: ${{ vars.HAS_STAGING_SECRETS }}
        run: |
          # 演练模式的 staging 用 IMM_FAKE_ENGINE=1 起服且不校验产物实体，只能证明
          # 门禁管道没坏，不具备晋级资格。缺真实 staging 时在此硬失败，不静默跳过。
          if [ "$HAS_STAGING" != "true" ]; then
            echo "[FAIL] 拒绝晋级：vars.HAS_STAGING_SECRETS != 'true'，staging 为演练实例。"
            echo "       处置：配置 secrets STAGING_HOST / STAGING_USER / STAGING_SSH_KEY，"
            echo "       并设仓库变量 HAS_STAGING_SECRETS=true 后重跑。"
            exit 1
          fi
      - name: Promote (delegate to blue-green script with automatic rollback)
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # P2-12：deploy 子命令 = idle 起服验证 → promote → 完整 smoke → 观察窗口，
          # 任一步失败自动回滚到 LAST_GOOD
          echo "[INFO] Promoting $IMAGE_TAG to production via blue-green"
          bash scripts/deploy/bluegreen.sh deploy "$IMAGE_TAG"

      - name: Rollback on any promotion failure
        if: failure()
        run: bash scripts/deploy/bluegreen.sh rollback || echo "[WARN] 自动回滚失败，需人工按 docs/runbooks/service_startup.md 介入"
