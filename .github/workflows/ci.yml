name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # 每日 UTC 02:00（北京时间 10:00）运行全量测试
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - run: pip install ruff
      - run: ruff check bin/ tests/
      - run: python -m compileall -q bin tests

  test:
    name: Test + Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check
          pip install pytest-cov pytest-asyncio pytest-timeout pytest-xdist hypothesis factory-boy
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=bin/integrated_app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  sast:
    name: SAST - pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sast-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sast-
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (SCA)
        run: |
          # 扫描 requirements.txt 中的已知漏洞
          pip-audit -r requirements.txt --strict || true

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-smoke-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check
          pip install pytest-cov pytest-asyncio
      - name: Run smoke tests (core critical path)
        run: |
          python -m pytest \
            tests/test_config.py \
            tests/test_path_guard_attacks.py \
            tests/test_workflow.py \
            tests/test_api_contract.py::TestBasicContract::test_health_ok \
            tests/test_api_contract.py::TestBasicContract::test_config_ok \
            -v
