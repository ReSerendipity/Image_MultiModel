name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v2.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── 创建 GitHub Release ───────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG, version: $VERSION"

      - name: Run tests before release
        run: |
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio pytest-timeout hypothesis factory-boy
          python -m pytest -q --tb=short

      - name: Build portable package (Windows)
        run: |
          echo "Note: Portable package build requires Windows runner."
          echo "Skipping portable package build in this workflow."
          echo "To build portable package, run scripts/pack_portable.ps1 on Windows."

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.version.outputs.version }}"
          # Use awk to extract the section between version headers
          awk -v ver="## \[${VERSION}\]" '
            $0 ~ ver { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # If empty, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi
          echo "Release notes extracted:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false

  # ── 发布后通知 ─────────────────────────────────────────
  notify:
    name: Release Notification
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Print release info
        run: |
          echo "Release ${{ needs.release.outputs.tag }} published successfully."
          echo "Next steps:"
          echo "  1. Build portable package on Windows: scripts/pack_portable.ps1"
          echo "  2. Upload portable package to the GitHub Release"
          echo "  3. Update documentation if needed"
