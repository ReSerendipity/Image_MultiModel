name: Security

on:
  schedule:
    # 每周一 UTC 06:00（北京时间 14:00）运行安全扫描
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-lock.txt"
      - "Dockerfile"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-lock.txt"
      - "Dockerfile"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 依赖安全扫描 (pip-audit) ──────────────────────────
  pip-audit:
    name: pip-audit - Python Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          # 扫描 requirements.txt 中的已知漏洞（发现高危 CVE 时阻断 CI）
          pip-audit -r requirements.txt --strict

      - name: Run pip-audit on lock file
        env:
          # 锁文件中的 torch/torchvision 使用 PyTorch CPU 本地变体（如 torchvision==0.28.0+cpu），
          # 这些 +cpu 版本仅发布在 PyTorch CPU 源，PyPI 上不存在，pip-audit 默认解析会失败。
          # 通过 PIP_EXTRA_INDEX_URL 让 pip 解析后端能定位 +cpu 版本。
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          if [ -f requirements-lock.txt ]; then
            pip-audit -r requirements-lock.txt
          fi

  # ── 容器镜像安全扫描 (Trivy) ──────────────────────────
  trivy:
    name: Trivy - Container Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t image-multimodel:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          image-ref: "image-multimodel:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          output: "trivy-report.txt"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt

  # ── 代码安全扫描 (CodeQL) ─────────────────────────────
  codeql:
    name: CodeQL - Code Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── 密钥泄露扫描 (Trivy FS) ───────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          scan-type: "fs"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          scanners: "secret"

  # ── 许可证通知完整性 (2026-09-04 安全评估 H1) ─────────
  license-notice-check:
    name: Third-Party Notice Check (GPL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify comfy_kernel GPL notice & compliance doc
        run: |
          grep -qi "comfy" THIRD_PARTY_NOTICES.md \
            || { echo "::error::THIRD_PARTY_NOTICES.md 缺少 comfy_kernel 条目（GPL-3.0 通知腐化）"; exit 1; }
          grep -qi "GPL" THIRD_PARTY_NOTICES.md \
            || { echo "::error::THIRD_PARTY_NOTICES.md 缺少 GPL 许可声明"; exit 1; }
          grep -qi "GPL" NOTICE \
            || { echo "::error::NOTICE 缺少 GPL 许可声明"; exit 1; }
          test -f docs/GPL_COMPLIANCE.md \
            || { echo "::error::docs/GPL_COMPLIANCE.md 缺失（源码获取义务文档）"; exit 1; }
          echo "OK: third-party notices intact."
