version: 2
updates:
  # minor/patch 合并为单个 PR，major 仍各自单独开 PR（便于逐个评审高风险版本跳跃）。
  # open-pull-requests-limit 限制并发 PR 数，避免 Dependabot 一次性铺开挤占 Actions 并发额度。
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # pydantic pins pydantic-core exactly (2.13.5 -> 2.46.5). Dependabot bumps
      # the two independently in this hand-maintained lock and produced an
      # uninstallable pair (see DraftPeek#92 / TTS_MultiModel#87). Regenerate the
      # lock instead: let pip resolve the pair together.
      - dependency-name: "pydantic-core"
      - dependency-name: "pydantic_core"
      # Ignoring only the core half is what let 6e9de9c (the minor-and-patch
      # group) split the pair again: it moved pydantic 2.13.4 -> 2.13.5, which
      # requires pydantic-core==2.46.5, while the ignored core stayed pinned at
      # 2.46.4 -> ResolutionImpossible on the whole lock. Ignore both ends so
      # the pair can only move together, via an explicit lock regeneration.
      - dependency-name: "pydantic"
      # omegaconf 2.3.1 pins antlr4-python3-runtime exactly (requires_dist:
      # "antlr4-python3-runtime==4.9.*"). Dependabot's minor-and-patch group
      # raised antlr4 to 4.13.2 in this hand-maintained lock while omegaconf
      # stayed 2.3.1, producing an uninstallable pair: pip reports
      # ResolutionImpossible, which breaks `pip install -r
      # requirements-lock.txt` -- the path app/clean_launch.py uses at startup.
      # Same failure class as the pydantic-core pair above: keep the two in
      # lockstep by moving omegaconf, then refresh antlr4 with the lock.
      # sympy caps its own math dependency: sympy 1.14.0 (latest stable release
      # on PyPI as of 2026-09-24) requires mpmath<1.4,>=1.1.0, while 6e9de9c-style
      # group bumps keep raising mpmath to 1.4.1 -> ResolutionImpossible on the
      # whole lock. There is no newer sympy that accepts mpmath>=1.4, so this pair
      # cannot move upward together; keep mpmath pinned below sympy's ceiling and
      # refresh both together once upstream sympy lifts the cap.
      - dependency-name: "mpmath"
      - dependency-name: "antlr4-python3-runtime"
    groups:
      # 显式分族，取代 patterns: ["*"]。blanket 分组会把互有强约束的针卷进同一次
      # "全选"升级并各走各的：6e9de9c 与 b709767 两次都因此把锁变成不可解
      # （antlr4/pydantic/mpmath 三对，见上面 ignore 的三条注释）。族内成员由
      # dependabot 合进同一个 PR 一起移动，族与族之间互不牵连。
      # 未列进任何组的依赖不会被忽略，只是不再有分组 PR —— dependabot 会为其开
      # 单独 PR；注意 open-pull-requests-limit: 5 会限流，必要时按月分批放行。
      torch-family:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["torch", "torchvision", "torchaudio"]
      web-stack:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["fastapi", "starlette", "uvicorn", "python-multipart", "jinja2"]
      imaging-science:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["numpy", "scipy", "Pillow", "opencv-python-headless", "PyWavelets"]
      http-client:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["aiohttp", "httpx", "websockets"]
      model-tooling:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["transformers", "accelerate", "safetensors", "sentencepiece",
                   "einops", "omegaconf", "controlnet-aux", "clip-anytorch"]
      test-tooling:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["pytest", "pytest-asyncio", "pytest-cov", "pytest-timeout",
                   "pytest-xdist", "pytest-playwright", "playwright", "hypothesis",
                   "factory-boy", "beautifulsoup4", "coverage"]
      security-crypto:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["cryptography", "pynvml"]
      runtime-utils:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["PyYAML", "python-dotenv", "aiofiles", "aiosqlite", "psutil",
                   "tqdm", "rich"]
  - package-ecosystem: npm
    directory: "/tests"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
