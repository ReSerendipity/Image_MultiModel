# Image MultiModel — Blue-Green 双槽位（P2-12）
#
# 用法（推荐通过 scripts/deploy/bluegreen.sh 调用，不建议直接手敲）：
#   docker compose -f docker-compose.bluegreen.yml --profile blue up -d --no-build
#   docker compose -f docker-compose.bluegreen.yml --profile green up -d --no-build
#
# 设计（评估 §9-P2-12，单 GPU 场景）：
#   - 同一台机器、同一块 GPU 上无法同时加载两份 9B 权重，因此不做「双活」，
#     而是「旧容器保持服务 + 新容器独立健康检查 + 切流」：
#       blue  : 当前 active 槽位（对外端口，默认 8288）
#       green : idle 槽位（仅 127.0.0.1:8289 内部健康检查，不对外）
#   - promote 时互换角色：新 green 切为 active，旧 blue 停止并保留为 last-known-good；
#   - rollback 一条命令把 active 指回 last-known-good 镜像 tag。
#
# 槽位角色由 /opt/imm/active_slot（或本地 .imm_slot）记录，bluegreen.sh 维护。

services:
  imm-blue:
    profiles: ["blue"]
    image: "image-multimodel:${BLUE_TAG:?BLUE_TAG 未设置 —— 请先运行 python scripts/build_release_metadata.py}"
    container_name: imm-blue
    restart: "no"          # 由 bluegreen.sh 显式控制生命周期
    ports:
      - "127.0.0.1:8288:8288"
    environment:
      - MODELS_SOURCE_MODE=portable
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - MODELSCOPE_OFFLINE=1
      - COMFYUI_DISABLE_UPDATE_CHECK=1
      - IMM_PORT=8288
    volumes:
      - ./model:/app/model:ro
      - ./workflows:/app/workflows:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./comfy_kernel:/app/comfy_kernel:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8288/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 60s

  imm-green:
    profiles: ["green"]
    image: "image-multimodel:${GREEN_TAG:?GREEN_TAG 未设置 —— 请先运行 python scripts/build_release_metadata.py}"
    container_name: imm-green
    restart: "no"
    # idle 槽位只绑本机回环，不对外服务（单 GPU：不能与 active 同时常驻显存）
    ports:
      - "127.0.0.1:8289:8288"
    environment:
      - MODELS_SOURCE_MODE=portable
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - MODELSCOPE_OFFLINE=1
      - COMFYUI_DISABLE_UPDATE_CHECK=1
      - IMM_PORT=8288
    volumes:
      - ./model:/app/model:ro
      - ./workflows:/app/workflows:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml
      - ./comfy_kernel:/app/comfy_kernel:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8288/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 60s
