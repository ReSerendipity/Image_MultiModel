[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --timeout=180"
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/e2e"]
filterwarnings = [
    "ignore:Using.*httpx.*deprecated",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
    "e2e: marks tests as end-to-end tests",
    "smoke: marks tests as smoke tests (core critical path)",
]

[tool.coverage.run]
source = ["app/integrated_app"]
omit = [
    "*/__init__.py",
    "*/locales/*",
    "*/static/*",
    "*/schemas/*",
]

[tool.coverage.report]
# 当前实测 70.25%（612 passed）。未达标部分集中在需 torch/comfy 的 GPU 依赖模块
# （native/diffusers_engine 0%、seedvr2_service 0%、preprocessors 等），CI 无 GPU 时
# 这些用例被整体 skip，故 75% 暂不可达。此处取实测可达的 70% 作为强制门禁，
# 75% 保留为目标值（待 CI 具备 torch/comfy 后可上调，届时同步本文件与 ci.yml）。
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B008", "B017", "B905", "UP042", "UP036", "B904", "B007", "SIM102", "SIM108", "SIM105", "SIM117", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["integrated_app", "app"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "app/integrated_app/static/",
    "app/integrated_app/locales/",
    "app/integrated_app/comfy/schemas/",
    "tests/e2e/",
]

[[tool.mypy.overrides]]
module = ["aiohttp.*", "PIL.*", "cv2.*", "pydantic.*", "yaml.*", "numpy.*", "scipy.*"]
ignore_missing_imports = true
