[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/e2e"]
filterwarnings = [
    "ignore:Using.*httpx.*deprecated",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["bin/integrated_app"]
omit = [
    "*/__init__.py",
    "*/locales/*",
    "*/static/*",
    "*/schemas/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B008", "B017", "B905", "UP042", "UP036", "B904", "B007", "SIM102", "SIM108", "SIM105", "SIM117", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["integrated_app", "bin"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
mypy_path = ["bin"]
exclude = [
    "bin/integrated_app/static/",
    "bin/integrated_app/locales/",
    "bin/integrated_app/comfy/schemas/",
    "tests/e2e/",
]

[[tool.mypy.overrides]]
module = ["aiohttp.*", "PIL.*", "cv2.*", "pydantic.*", "yaml.*", "numpy.*", "scipy.*"]
ignore_missing_imports = true
