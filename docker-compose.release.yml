# Image MultiModel — 生产发布 overlay（P1-10 不可变版本 artifact）
#
# 用途：在 docker-compose.yml 的「不可变 tag」之上再叠加**镜像 digest 固化**，
#       使部署单元完全不可变（tag 可被覆盖重写，digest 不可）。
#
# 前置：
#   1. 构建并推送镜像后取得 digest：
#        docker buildx imagetools inspect image-multimodel:$IMAGE_TAG \
#          --format '{{.Manifest.Digest}}'
#   2. 写入 .env：
#        python scripts/build_release_metadata.py --version v2.0.1 --digest sha256:<digest>
#      （或手工在 .env 中补一行 IMAGE_DIGEST=sha256:...）
#
# 启动：
#   docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
#
# 校验产物与工作树是否漂移：
#   python scripts/build_release_metadata.py --verify --strict

services:
  image-multimodel:
    # tag + digest 双重固定：即使有人重推同名 tag，digest 不匹配也不会被拉取
    # 同样必须用引号包裹，避免 ${VAR:?message} 中的冒号破坏 YAML 解析
    image: "image-multimodel:${IMAGE_TAG:?IMAGE_TAG 未设置 —— 请先运行 python scripts/build_release_metadata.py}@${IMAGE_DIGEST:?IMAGE_DIGEST 未设置 —— 生产部署必须按 digest 固化镜像，请运行 python scripts/build_release_metadata.py --version <ver> --digest sha256:...}"

    # 生产环境显式关闭自动重启以外的隐式行为，保持与基础 compose 一致的挂载与端口
    restart: unless-stopped
